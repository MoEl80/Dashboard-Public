<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forex Analysis Cloud</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Forex Analysis Cloud</h1>
      <p>28-pair Technical Engine v2 + institutional fundamentals + sentiment + execution dashboard</p>
    </div>
    <div class="topbar-actions">
      <div class="status" id="status">Loading latest analysis…</div>
      <button id="refreshAnalysis" class="refresh-btn" type="button" title="Open the private GitHub Actions workflow when signed in and wait for a newly published analysis">
        <span class="refresh-icon" aria-hidden="true">↻</span>
        <span id="refreshLabel">Refresh Analysis</span>
      </button>
      <div class="refresh-note" id="refreshNote" aria-live="polite"></div>
    </div>
  </header>

  <main>
    <section class="summary-grid" id="summaryGrid"></section>

    <section class="controls card">
      <input id="search" type="search" placeholder="Search pair, e.g. AUD/JPY" />
      <select id="decisionFilter">
        <option value="all">All decisions</option>
        <option value="buy">Buy</option>
        <option value="sell">Sell</option>
        <option value="no_trade">No trade</option>
      </select>
      <select id="riskFilter">
        <option value="all">All event risk</option>
        <option value="normal">Normal</option>
        <option value="elevated">Elevated</option>
        <option value="high">High</option>
        <option value="unknown">Unknown</option>
      </select>
      <button id="resetFilters">Reset</button>
    </section>

    <section class="table-card card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th><th>Pair</th><th>Recommendation</th><th>Combined</th><th>Confidence</th><th>Technical</th><th>Fundamental</th><th>Event Risk</th><th>Spread</th>
            </tr>
          </thead>
          <tbody id="pairsTable"></tbody>
        </table>
      </div>
    </section>

    <section id="detailPanel" class="detail-panel card hidden"></section>
  </main>

  <script src="app.js"></script>
  <script src="technical-v2-ui.js"></script>
</body>
</html>
